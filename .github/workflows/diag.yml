name: Diag flow timing
on:
  push:
    branches: [diag-flow-timing]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Cache Robolectric Android jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-15-robolectric-13954326-i7
      - name: Flow tests with timings
        run: set +e; timeout 40m ./gradlew --no-daemon testDebugUnitTest --tests "eu.motionforge.app.flows.AppFlowTest" ; echo EXIT=$?
      - name: Timings
        if: always()
        run: ls app/build/test-results/testDebugUnitTest | head; grep -h -o "testcase name=\"[^\"]*\" classname=\"[^\"]*\" time=\"[^\"]*\"" app/build/test-results/testDebugUnitTest/*.xml; grep -h -A3 "<failure" app/build/test-results/testDebugUnitTest/*.xml | head -40
