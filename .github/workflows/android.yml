name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon -Pmotionforge.requirePoseModel=true testDebugUnitTest

      - name: Screenshots of the main screens (design review; never blocks the build)
        continue-on-error: true
        env:
          MF_SCREENSHOTS: "1"
        run: ./gradlew --no-daemon -Pmotionforge.requirePoseModel=true testDebugUnitTest --tests "eu.motionforge.app.screenshots.*"

      - name: Publish screenshots to the ci-screenshots branch (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          [ -d app/build/reports/screenshots ] || exit 0
          mkdir -p /tmp/shots && cp app/build/reports/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          git init -q && git checkout -q -b ci-screenshots
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Build debug APK
        run: ./gradlew --no-daemon -Pmotionforge.requirePoseModel=true assembleDebug

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | tee apk-contents.txt
          grep -q "assets/models/pose_landmarker_lite.task" apk-contents.txt
          grep -q "assets/exercise_data/exercises.json" apk-contents.txt
          # Pose model must be stored uncompressed (MediaPipe memory-maps it).
          unzip -v "$APK" | grep -E "pose_landmarker_lite.task" | grep -q " Stored "
          # Coach models are optional (none bundled while new coaches are made); when present, each needs its manifest
          # and must be stored uncompressed.
          for c in coach_f coach_m; do
            if [ -f "app/src/main/assets/models/$c.glb" ]; then
              grep -q "assets/models/$c.clips.json" apk-contents.txt
              unzip -v "$APK" | grep -E "$c.glb" | grep -q " Stored "
            fi
          done
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Lint (report only during Phase 0)
        continue-on-error: true
        run: ./gradlew --no-daemon -Pmotionforge.requirePoseModel=true lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: motionforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling debug pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk motionforge-debug.apk
          gh release delete debug-latest -y --cleanup-tag || true
          gh release create debug-latest motionforge-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MOTIONFORGE debug build (${GITHUB_SHA::7})" \
            --notes "Automatic debug build of ${GITHUB_SHA}. For testing on your own device only — not for distribution."
