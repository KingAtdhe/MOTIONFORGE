name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon -Pmotionforge.requirePoseModel=true testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon -Pmotionforge.requirePoseModel=true assembleDebug

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | tee apk-contents.txt | grep -E "assets/models/pose_landmarker_lite.task|assets/models/coach_f.glb|assets/models/coach_f.clips.json|assets/models/coach_m.glb|assets/models/coach_m.clips.json|assets/exercise_data/exercises.json"
          # Model and GLB must be stored uncompressed (MediaPipe memory-maps the model).
          unzip -v "$APK" | grep -E "pose_landmarker_lite.task" | grep -q " Stored " && unzip -v "$APK" | grep -E "coach_f.glb" | grep -q " Stored "
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Lint (report only during Phase 0)
        continue-on-error: true
        run: ./gradlew --no-daemon -Pmotionforge.requirePoseModel=true lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: motionforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling debug pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk motionforge-debug.apk
          gh release delete debug-latest -y --cleanup-tag || true
          gh release create debug-latest motionforge-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MOTIONFORGE debug build (${GITHUB_SHA::7})" \
            --notes "Automatic debug build of ${GITHUB_SHA}. For testing on your own device only — not for distribution."
